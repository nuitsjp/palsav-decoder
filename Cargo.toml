[workspace]
members = ["cli", "shared", "web-api"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.96"
license = "GPL-3.0-or-later"
repository = "https://github.com/nuitsjp/palsav-decoder"
authors = ["Atsushi Nakamura"]

[workspace.dependencies]
flate2 = "1"
oozextract = "0.5"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
tempfile = "3"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
