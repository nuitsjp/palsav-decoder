name: Reference Pages

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Published release tag to deploy (for recovery)
        required: true
        default: v0.2.0
        type: string

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: reference-pages
  cancel-in-progress: false

jobs:
  build:
    if: >-
      (github.event_name == 'workflow_dispatch' && startsWith(inputs.release_tag, 'v')) ||
      startsWith(github.event.release.tag_name, 'v')
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.event.release.tag_name || inputs.release_tag }}
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.96.0
          targets: wasm32-unknown-unknown
      - uses: taiki-e/install-action@6c6fd71fe4fb72c3697d269963d0e15df8adedad # v2.85.10
        with:
          tool: wasm-bindgen-cli@0.2.127
      - run: node scripts/build-web.mjs
      - name: Prepare version-fixed reference path
        shell: pwsh
        run: |
          $version = if ($env:GITHUB_EVENT_NAME -eq "release") { "${{ github.event.release.tag_name }}" } else { "${{ inputs.release_tag }}" }
          New-Item -ItemType Directory -Path "dist\pages\$version" -Force | Out-Null
          Copy-Item "dist\web\*" -Destination "dist\pages\$version" -Recurse
      - name: Archive Pages artifact
        shell: bash
        run: >-
          tar --dereference --hard-dereference
          --directory "dist/pages"
          -cvf "$RUNNER_TEMP/artifact.tar"
          --exclude=.git --exclude=.github
          --force-local "."
      - name: Upload Pages artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: github-pages
          path: ${{ runner.temp }}/artifact.tar
          retention-days: 1
          if-no-files-found: error

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy reference artifact (no SLA)
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
