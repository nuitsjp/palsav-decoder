name: Reference Pages

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Published release tag to deploy (for recovery)
        required: true
        default: v0.2.0
        type: string

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: reference-pages
  cancel-in-progress: false

jobs:
  build:
    if: >-
      (github.event_name == 'workflow_dispatch' && startsWith(inputs.release_tag, 'v')) ||
      startsWith(github.event.release.tag_name, 'v')
    runs-on: ubuntu-24.04
    steps:
      - name: Download and verify exact published release artifact
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.release_tag }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          RELEASE_JSON="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG")"
          test "$(jq -r .draft <<< "$RELEASE_JSON")" = "false"
          test "$(jq -r .prerelease <<< "$RELEASE_JSON")" = "false"
          TAG_SHA="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG" --jq .object.sha)"
          ARCHIVE="palsav-web-$RELEASE_TAG.zip"
          mkdir -p release "dist/pages/$RELEASE_TAG"
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
            --pattern "$ARCHIVE" --pattern "$ARCHIVE.sha256" --dir release
          (cd release && sha256sum --check --strict "$ARCHIVE.sha256")
          unzip -q "release/$ARCHIVE" -d "dist/pages/$RELEASE_TAG"
          MANIFEST="dist/pages/$RELEASE_TAG/decoder-manifest.json"
          test "$(jq -r .decoderVersion "$MANIFEST")" = "${RELEASE_TAG#v}"
          test "$(jq -r .sourceCommitSha "$MANIFEST")" = "$TAG_SHA"
      - name: Archive Pages artifact
        run: >-
          tar --dereference --hard-dereference
          --directory "dist/pages"
          -cvf "$RUNNER_TEMP/artifact.tar"
          --exclude=.git --exclude=.github
          "."
      - name: Upload Pages artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: github-pages
          path: ${{ runner.temp }}/artifact.tar
          retention-days: 1
          if-no-files-found: error

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy reference artifact (no SLA)
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
