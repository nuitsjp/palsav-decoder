name: Reference Pages

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: reference-pages
  cancel-in-progress: false

jobs:
  build:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.event.release.tag_name, 'v')
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.event.release.tag_name || github.ref }}
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.96.0
          targets: wasm32-unknown-unknown
      - uses: taiki-e/install-action@6c6fd71fe4fb72c3697d269963d0e15df8adedad # v2.85.10
        with:
          tool: wasm-bindgen-cli@0.2.127
      - run: node scripts/build-web.mjs
      - name: Prepare version-fixed reference path
        shell: pwsh
        run: |
          $version = if ($env:GITHUB_EVENT_NAME -eq "release") { "${{ github.event.release.tag_name }}" } else { "preview-$($env:GITHUB_SHA.Substring(0, 12))" }
          New-Item -ItemType Directory -Path "dist\pages\$version" -Force | Out-Null
          Copy-Item "dist\web\*" -Destination "dist\pages\$version" -Recurse
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: dist/pages

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy reference artifact (no SLA)
        id: deployment
        uses: actions/deploy-pages@f81ad71d2e78487340fb3a9474b4c0e85a2a5c1a # v4
