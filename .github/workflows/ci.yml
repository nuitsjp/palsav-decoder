name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.96.0
          components: rustfmt, clippy
      - name: Install pinned Rust CI tools
        uses: taiki-e/install-action@6c6fd71fe4fb72c3697d269963d0e15df8adedad # v2.85.10
        with:
          tool: cargo-llvm-cov@0.8.7,cargo-audit@0.22.1
      - run: cargo fmt --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace --locked
      - name: Enforce coverage baseline
        shell: pwsh
        run: |
          cargo llvm-cov --workspace --all-targets --locked --fail-under-lines 85 --fail-under-functions 80 --fail-under-regions 80
      - name: Audit dependencies
        shell: pwsh
        run: cargo audit
      - run: cargo build --release --locked --package palsav-decoder-cli
      - name: Verify standalone executable
        shell: pwsh
        run: .\target\release\palsav.exe --version

