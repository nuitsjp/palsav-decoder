name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  windows:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.96.0
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - name: Install pinned license tool
        uses: taiki-e/install-action@6c6fd71fe4fb72c3697d269963d0e15df8adedad # v2.85.10
        with:
          tool: cargo-about@0.9.1,wasm-bindgen-cli@0.2.127
      - name: Validate tag provenance
        shell: pwsh
        run: |
          git fetch origin main
          git merge-base --is-ancestor $env:GITHUB_SHA origin/main
          if ($LASTEXITCODE -ne 0) { throw "Release tag must point to a commit on main." }
          $metadata = cargo metadata --no-deps --format-version 1 | ConvertFrom-Json
          $version = ($metadata.packages | Where-Object name -eq "palsav-decoder-cli").version
          if (-not $version) { throw "CLI package metadata was not found." }
          if ($env:GITHUB_REF_NAME -ne "v$version") { throw "Tag must match Cargo version v$version." }
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace --locked
      - run: cargo build --release --locked --package palsav-decoder-cli
      - run: node --test site/core.test.mjs
      - run: node scripts/build-web.mjs
      - name: Generate third-party licenses
        shell: pwsh
        run: cargo about generate about.hbs --output-file THIRD_PARTY_LICENSES.html
      - name: Create license-complete archive and checksum
        shell: pwsh
        run: |
          $archiveName = "palsav-$env:GITHUB_REF_NAME-windows-x86_64"
          $archiveDirectory = Join-Path dist $archiveName
          New-Item -ItemType Directory -Path $archiveDirectory -Force | Out-Null
          Copy-Item target\release\palsav.exe, LICENSE, COPYRIGHT, README.md, THIRD_PARTY_NOTICES.md, THIRD_PARTY_LICENSES.html -Destination $archiveDirectory
          "Corresponding source: https://github.com/$env:GITHUB_REPOSITORY/tree/$env:GITHUB_SHA" | Set-Content -Encoding utf8 (Join-Path $archiveDirectory SOURCE.txt)
          $archivePath = "dist\$archiveName.zip"
          Compress-Archive -Path "$archiveDirectory\*" -DestinationPath $archivePath
          (Get-FileHash $archivePath -Algorithm SHA256).Hash.ToLowerInvariant() + "  $archiveName.zip" | Set-Content -Encoding ascii "$archivePath.sha256"
          $webArchiveName = "palsav-web-$env:GITHUB_REF_NAME"
          $webArchivePath = "dist\$webArchiveName.zip"
          Compress-Archive -Path "dist\web\*" -DestinationPath $webArchivePath
          (Get-FileHash $webArchivePath -Algorithm SHA256).Hash.ToLowerInvariant() + "  $webArchiveName.zip" | Set-Content -Encoding ascii "$webArchivePath.sha256"
      - name: Attest release archive
        uses: actions/attest-build-provenance@43d14bc2b83dec42d39ecae14e916627a18bb661 # v3
        with:
          subject-path: dist/*.zip
      - uses: softprops/action-gh-release@c12583777ecdfd3be55c69cf75464299dc01057e # v3.0.2
        with:
          files: |
            dist/*.zip
            dist/*.sha256
          generate_release_notes: true
          draft: true

